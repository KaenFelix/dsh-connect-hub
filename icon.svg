<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="8" y1="4" x2="58" y2="62" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5B6CFF"/>
      <stop offset=".55" stop-color="#6E5BFF"/>
      <stop offset="1" stop-color="#9A5CFF"/>
    </linearGradient>
    <linearGradient id="hub" x1="26" y1="24" x2="42" y2="42" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E8EBFF"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>
  <circle cx="53" cy="11" r="14" fill="#FFFFFF" opacity=".09"/>
  <!-- Links first, so the nodes sit on top of them like real sockets. -->
  <g fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" opacity=".55">
    <path d="M32 32L17 19"/>
    <path d="M32 32L47 19"/>
    <path d="M32 32L17 45"/>
    <path d="M32 32L47 45"/>
  </g>
  <!-- The hub the connectors report into. -->
  <circle cx="32" cy="32" r="10.5" fill="url(#hub)"/>
  <circle cx="32" cy="32" r="4.2" fill="#5B6CFF"/>
  <!-- Four platforms around it; two filled, two hollow, so the set reads as
       growing rather than fixed at four. -->
  <g stroke="#FFFFFF" stroke-width="2.2">
    <circle cx="16.5" cy="18.5" r="4.6" fill="#7C86FF"/>
    <circle cx="47.5" cy="18.5" r="4.6" fill="#7C86FF"/>
    <circle cx="16.5" cy="45.5" r="4.6" fill="none" opacity=".82"/>
    <circle cx="47.5" cy="45.5" r="4.6" fill="none" opacity=".82"/>
  </g>
</svg>